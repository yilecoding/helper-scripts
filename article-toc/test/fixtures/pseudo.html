<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>公众号式文章：小标题是整段加粗</title></head>
<body>
<article>
    <h2>一、背景</h2>
    <p><strong>1. 现状</strong></p>
    <p>正文。</p>
    <p><strong>2. 问题</strong></p>
    <p>正文里有<strong>加粗的词</strong>，不是标题。</p>
    <p><strong>这是一整句加粗的强调，不是标题。</strong></p>
    <blockquote><p><strong>引用里的加粗</strong></p></blockquote>
    <h2>二、方案</h2>
    <p><b>1. 设计</b></p>
    <p>正文。</p>
</article>
</body>
</html>
