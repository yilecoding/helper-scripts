<!doctype html>
<html lang="zh-CN">
<head>

<title>如何写一个用户脚本 - 示例博客</title>
<style>

</style>

<main class="layout">

            <h4>访客 A</h4><p>写得好。</p>
            <h4>访客 B</h4><p>学到了。</p>
        </section>
    </article>
    <aside class="sidebar">
        <h3>热门文章</h3><p>…</p>
        <h3>标签</h3><p>…</p>
        <h3>归档</h3><p>…</p>

</main>
<footer>
