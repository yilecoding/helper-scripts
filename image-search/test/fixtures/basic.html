<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>basic</title>
<style>
    body { margin: 0; }
    img { display: block; width: 200px; height: 150px; }
    #a { position: absolute; left: 20px; top: 20px; }
    #text { position: absolute; left: 300px; top: 20px; width: 200px; height: 100px; }
    #inline { position: absolute; left: 20px; top: 300px; width: 100px; height: 100px; }
    #php { position: absolute; left: 150px; top: 300px; width: 100px; height: 100px; }
    #box { position: absolute; left: 20px; top: 250px; }
</style>
</head>
<body>
<img id="a" src="https://img.example/400x300/a.png" alt="a">
<!-- 8×6 的真图：1×1 的会被当成透明垫片跳过 -->
<img id="inline" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAGCAIAAABxZ0isAAAAEUlEQVR4nGN4ammKFTEMpAQAwdQ/kWw0+fcAAAAASUVORK5CYII=">
<img id="php" src="https://img.example/200x200/show.php?id=3">
<input id="box" placeholder="在这里打字">
<p id="text">这里只有文字，Alt + 右键不应当弹菜单。</p>
<script>
    // 很多站这样屏蔽右键；页面自己的处理器记一下有没有被调用
    window.pageContextMenus = 0
    document.oncontextmenu = () => { window.pageContextMenus++; return false }
    // 页面自己的单键快捷键（像 GitHub 的 S 聚焦搜索）
    window.pageKeys = ''
    document.addEventListener('keydown', e => { window.pageKeys += e.key })
</script>
</body>
</html>
