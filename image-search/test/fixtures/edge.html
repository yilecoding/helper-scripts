<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>edge</title>
<style>
    body { margin: 0; }
    img { position: absolute; display: block; width: 120px; height: 90px; }
    #br { right: 0; bottom: 0; }
    #tl { left: 0; top: 0; }
    /* 文件名里有中文、空格、&、编码过的 #，query 里有 & 和中文，末尾还挂着真正的 #hash */
    #weird { left: 300px; top: 200px; }
</style>
</head>
<body>
<img id="br" src="https://img.example/300x200/br.png">
<img id="tl" src="https://img.example/300x200/tl.png">
<img id="weird" src="https://img.example/300x200/图片 a&amp;b%23c.png?size=大&amp;v=1#part">
</body>
</html>
