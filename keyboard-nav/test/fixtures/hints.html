<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>链接提示</title>
<style>
    body { margin: 0; padding: 8px; font: 14px/1.6 sans-serif; min-height: 2400px; position: relative; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; width: 900px; }
    nav a { padding: 2px 6px; }
    section { margin: 12px 0; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
    .box { position: relative; width: 140px; height: 30px; }
    .mask { position: absolute; inset: 0; background: #eee; }
    .clip { overflow: hidden; width: 100px; height: 30px; position: relative; background: #fafafa; }
    .clip a { position: absolute; left: 200px; top: 0; }
    #outer { width: 120px; }
    #outer a { display: block; }
    #far { position: absolute; top: 1500px; left: 20px; }
</style>
</head>
<body>
<nav id="links"></nav>
<section>
    <button class="v" id="btn">按钮</button>
    <input class="v" id="name" placeholder="名字">
    <label class="v" id="cblabel"><input type="checkbox" id="cb" style="display:none"> 自定义复选框</label>
    <label for="name2">邮箱</label><input class="v" id="name2">
    <div class="v" id="rb" role="button" tabindex="0">role 按钮</div>
    <div class="v" id="outer" role="button" tabindex="0"><a class="inner" href="page2.html?inner">同一块的里层</a></div>
</section>
<section>
    <div class="x" tabindex="-1">tabindex=-1 的容器</div>
    <a class="x" href="page2.html" style="display:none">display:none</a>
    <button class="x" style="visibility:hidden">visibility:hidden</button>
    <button class="x" disabled>disabled</button>
    <div class="box"><a class="x" id="covered" href="page2.html">被盖住的链接</a><div class="mask">遮罩</div></div>
    <div class="clip"><a class="x" href="page2.html">被裁掉</a></div>
</section>
<a class="x" id="far" href="page2.html">视口外的链接</a>
<script>
    const nav = document.getElementById('links')
    for (let i = 1; i <= 24; i++) {
        const a = document.createElement('a')
        a.className = 'v'
        a.href = 'page2.html?n=' + i
        a.textContent = '链接 ' + i
        nav.appendChild(a)
    }
    window.__events = []
    const btn = document.getElementById('btn')
    for (const type of ['pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click']) {
        btn.addEventListener(type, () => window.__events.push(type))
    }
    document.getElementById('rb').addEventListener('click', () => window.__events.push('rb'))
</script>
</body>
</html>
