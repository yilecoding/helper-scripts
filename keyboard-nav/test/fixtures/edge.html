<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>边界情况</title>
<style>
    body { margin: 0; font: 14px/1.6 sans-serif; height: 3000px; }
    header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: #333; color: #fff; z-index: 1; }
    #list { position: absolute; top: 50px; left: 0; width: 300px; height: 300px; overflow: auto; }
    #list a { display: block; height: 30px; }
</style>
</head>
<body onclick="void 0">
<header>固定顶栏</header>
<div id="list"></div>
<div style="position:absolute; top: 400px; left: 0">
    <x-field id="field"></x-field>
    <div id="editor" contenteditable="true" style="width: 200px; height: 40px; border: 1px solid #ccc">可编辑</div>
</div>
<script>
    const list = document.getElementById('list')
    for (let i = 1; i <= 30; i++) {
        const a = document.createElement('a')
        a.href = 'page2.html?item=' + i
        a.textContent = '条目 ' + i
        list.appendChild(a)
    }
    customElements.define('x-field', class extends HTMLElement {
        constructor() {
            super()
            this.attachShadow({ mode: 'open' }).innerHTML = '<input id="inner" placeholder="shadow 里的输入框">'
        }
    })
</script>
</body>
</html>
