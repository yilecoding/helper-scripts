<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>后台布局：body 不滚，内部 div 滚</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.6 sans-serif; }
    header { height: 50px; background: #333; color: #fff; }
    .layout { display: flex; height: calc(100% - 50px); }
    #side { width: 200px; overflow: auto; background: #f4f4f4; }
    #side .item { height: 30px; }
    #main { flex: 1; overflow: auto; }
    .block { height: 400px; border-bottom: 1px solid #ccc; }
    .wide { width: 3000px; height: 20px; background: linear-gradient(90deg, #eee, #999); }
    pre { max-height: 120px; overflow: auto; margin: 0; }
</style>
</head>
<body>
<header>顶栏</header>
<div class="layout">
    <aside id="side"></aside>
    <main id="main">
        <div class="wide"></div>
        <div id="blocks"></div>
    </main>
</div>
<script>
    const side = document.getElementById('side')
    for (let i = 1; i <= 60; i++) {
        const d = document.createElement('div')
        d.className = 'item'
        d.textContent = '菜单 ' + i
        side.appendChild(d)
    }
    const box = document.getElementById('blocks')
    for (let i = 1; i <= 20; i++) {
        const d = document.createElement('div')
        d.className = 'block'
        d.textContent = '第 ' + i + ' 块'
        box.appendChild(d)
    }
</script>
</body>
</html>
