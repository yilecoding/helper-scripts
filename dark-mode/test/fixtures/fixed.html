<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>固定栏</title>
<style>
    body { margin: 0; font: 16px/1.6 sans-serif; }
    #topbar { position: fixed; top: 0; left: 0; right: 0; height: 48px; background: #fff; border-bottom: 1px solid #ddd; }
    #fab { position: fixed; right: 20px; bottom: 20px; width: 40px; height: 40px; border-radius: 50%; background: #36c; }
    .long { height: 3000px; padding-top: 60px; }
</style>
</head>
<body>
<div id="topbar">顶栏</div>
<div class="long">很长的正文</div>
<div id="fab"></div>
</body>
</html>
