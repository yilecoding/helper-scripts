<!doctype html>
<html lang="zh-CN">
<head>

<title>普通页面</title>

    /* 正常的固定顶栏和右下角悬浮按钮：不能被当成遮罩或横幅 */

    #fab { position: fixed; right: 16px; bottom: 16px; width: 48px; height: 48px; border-radius: 50%; background: #1677ff; z-index: 9999; }
    main { padding: 72px 16px; }
    main p { height: 400px; }
</style>
</head>
<body>
<div id="nav">站点导航　首页　文章　关于</div>
<main>
    <h1>普通文章</h1>
    <p id="p1">正文第一段。</p>
    <p>正文第二段。</p>
    <p>正文第三段。</p>
</main>
<div id="fab"></div>
</body>
</html>
