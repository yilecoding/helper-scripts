<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>划词翻译测试页</title>
<style>
    body { font: 16px/1.6 sans-serif; margin: 40px; max-width: 720px; }
    p { margin: 0 0 16px; }
    .spacer { height: 2000px; }
</style>
</head>
<body>
    <p id="en">Machine translation has improved a lot in recent years.</p>
    <p id="zh">今天天气很好，我们去公园散步吧。</p>
    <p>Single word: <span id="word">serendipity</span>, Chinese word: <span id="zhword">你好</span>, verb: <span id="run">run</span></p>
    <p id="ja">今日はいい天気ですね。</p>
    <p id="mixed">我们用 React 和 TypeScript 写前端。</p>
    <p><input id="inp" type="text" size="50" value="The quick brown fox jumps over the lazy dog"></p>
    <p><textarea id="ta" cols="40" rows="2">这是一段在文本框里的中文。</textarea></p>
    <p><input id="pwd" type="password" value="secret-password"></p>
    <div class="spacer"></div>
    <p id="bottom">This paragraph sits at the very bottom of the page.</p>
</body>
</html>
