<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>gallery</title>

    img { width: 60px !important; border: 5px solid red; }

</style>
</head>
<body>
<img src="https://img.example/200x150/g1.png">
<img src="https://img.example/1600x1200/g2.png">
<img src="https://img.example/800x600/g3.png">
<img src="https://img.example/300x900/g4.png">
<img src="https://img.example/500x500/g5.png">
<img src="https://img.example/120x400/g6.png">
</body>
</html>
