<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>顶栏固定的长文章</title>
<style>
    body { margin: 0; font: 18px/1.8 sans-serif; }
    header { position: fixed; top: 0; left: 0; right: 0; height: 90px; background: #333; color: #fff; z-index: 9; }
    article { padding-top: 90px !important; }
    article { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    p { margin: 0 0 1em; }
</style>
</head>
<body>
<header>站点导航</header>
<article id="post">
    <h1>一篇很长的文章</h1>
    <div class="body"></div>
</article>
<footer>页脚</footer>
<script>
    // 段落文字各不相同（锚点的文本指纹要能区分），长度也不同（高度不均匀）
    const body = document.querySelector('#post .body')
    for (let i = 1; i <= 80; i++) {
        if (i % 10 === 1) {
            const h = document.createElement('h2')
            h.textContent = '第 ' + Math.ceil(i / 10) + ' 章'
            body.appendChild(h)
        }
        const p = document.createElement('p')
        p.textContent = '第 ' + i + ' 段。' + '这是正文内容，'.repeat(8 + (i * 7) % 23)
        body.appendChild(p)
    }
</script>
</body>
</html>
