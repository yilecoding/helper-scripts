<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>正文在内层 div 里滚动的后台 / 文档站</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; font: 17px/1.8 sans-serif; }
    .top { position: absolute; top: 0; left: 0; right: 0; height: 50px; background: #333; color: #fff; }
    .side { position: absolute; top: 50px; bottom: 0; left: 0; width: 220px; overflow: auto; background: #f4f4f4; }
    .side li { height: 40px; }
    .scroll { position: absolute; top: 50px; bottom: 0; left: 220px; right: 0; overflow: auto; }
    article { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    p { margin: 0 0 1em; }
</style>
</head>
<body>
<div class="top">文档站</div>
<!-- 侧栏也能滚，但不是正文：不能被当成主滚动容器 -->
<div class="side"><ul></ul></div>
<div class="scroll"><article></article></div>
<script>
    const side = document.querySelector('.side ul')
    for (let i = 1; i <= 60; i++) side.insertAdjacentHTML('beforeend', '<li>菜单项 ' + i + '</li>')
    // 正文异步渲染（像 SPA 拉完接口再画），容器一开始是空的
    const q = new URLSearchParams(location.search)
    setTimeout(() => {
        const art = document.querySelector('.scroll article')
        for (let i = 1; i <= 80; i++) {
            const p = document.createElement('p')
            p.textContent = '第 ' + i + ' 段。' + '文档内容，'.repeat(10 + (i * 5) % 19)
            art.appendChild(p)
        }
        if (q.get('drift')) setTimeout(() => {
            const ad = document.createElement('div')
            ad.style.height = q.get('drift') + 'px'
            art.prepend(ad)
            for (let k = 1; k <= 2; k++) {
                const p = document.createElement('p')
                p.textContent = '置顶通知 ' + k + '：' + '内容'.repeat(30)
                art.prepend(p)
            }
        }, 300)
    }, 200)
</script>
</body>
</html>
